name: CI

on:
  push:
    branches:
      - main
      - master
      - 'copilot/**'
      - 'codex/**'
      - 'fix/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Install browser for accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Website browser audit
        run: npm run audit:website

      - name: Tool interaction audit
        run: npm run audit:tools

      - name: Retain browser audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-audits
          path: qa/output/
          if-no-files-found: ignore
