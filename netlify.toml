[build]
  command = "npm run build"
  publish = "dist"

[context.production]
  command = "npm run build && npm run audit:release:evidence && npx playwright install --with-deps chromium && node scripts/puk-audit/run.mjs --production"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# These rules deliberately do not overlap the generated build asset namespace.
# Logo and font filenames are stable, so clients must check for updated content.
[[headers]]
  for = "/assets/puk/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons.svg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Adressen der App (src/routes.js) liefern die App mit Status 200 aus; die Startseite ist index.html selbst.
# Test: src/test/netlify-redirects.test.js prüft, dass die Liste mit den Routen übereinstimmt.
[[redirects]]
  from = "/module"
  to = "/index.html"
  status = 200

[[redirects]]
