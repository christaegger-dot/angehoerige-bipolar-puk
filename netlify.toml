# Impressum und Datenschutz sind seit dem 26. November 2026 eine Seite.
[[redirects]]
  from = "/impressum"
  to = "/impressum-datenschutz#impressum"
  status = 301

[[redirects]]
  from = "/datenschutz"
  to = "/impressum-datenschutz#datenschutz"
  status = 301

# Alle übrigen Adressen: Seite «Diese Seite gibt es nicht» mit Status 404 (Fachstellen-Profil 2026.10.2).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
